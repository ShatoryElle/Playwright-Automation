name: CI 30.1 Tests

on: [push, pull_request]

jobs:
  cypress-firefox-run:
    runs-on: ubuntu-latest
    container: cypress/browsers:node-20.9.0-chrome-121.0.6167.85-1-ff-122.0-edge-121.0.2277.83-1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm install
        
      - name: Verify Firefox
        run: npx cypress install --browser firefox
        
      - name: Run Cypress tests in Firefox
        run: npx cypress run --browser firefox